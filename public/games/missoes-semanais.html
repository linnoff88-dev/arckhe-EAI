<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missões Semanais - EAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header h1 span {
            color: #ffd700;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 15px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffd700;
        }

        .stat-label {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .week-progress {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .day-badge {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }

        .day-badge.completed {
            background: linear-gradient(135deg, #00b894, #55efc4);
            border-color: #00b894;
        }

        .day-badge.current {
            background: linear-gradient(135deg, #ffd700, #f39c12);
            border-color: #ffd700;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .medals {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
        }

        .medal {
            font-size: 2rem;
            opacity: 0.3;
            transition: all 0.3s ease;
        }

        .medal.earned {
            opacity: 1;
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .game-area {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .mission-card {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            text-align: center;
        }

        .mission-card .emoji {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .mission-card .title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .mission-card .description {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 15px;
        }

        .mission-card .reward {
            background: rgba(255,215,0,0.3);
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
        }

        .missions-list {
            display: grid;
            gap: 15px;
        }

        .mission-item {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .mission-item:hover {
            background: rgba(255,255,255,0.15);
            transform: translateX(5px);
        }

        .mission-item.completed {
            background: rgba(0, 184, 148, 0.2);
            border-color: #00b894;
        }

        .mission-item.completed .mission-checkbox {
            background: #00b894;
        }

        .mission-checkbox {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .mission-checkbox.checked::after {
            content: '✓';
            color: white;
            font-weight: bold;
        }

        .mission-content {
            flex: 1;
        }

        .mission-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .mission-desc {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .mission-points {
            background: rgba(255,215,0,0.2);
            padding: 8px 15px;
            border-radius: 15px;
            font-weight: bold;
            color: #ffd700;
        }

        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .category-tab {
            padding: 10px 20px;
            border-radius: 25px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .category-tab:hover {
            background: rgba(255,255,255,0.2);
        }

        .category-tab.active {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
        }

        .streak-bonus {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
        }

        .streak-bonus h3 {
            margin-bottom: 5px;
        }

        .streak-bonus p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .celebration.show {
            display: flex;
        }

        .celebration-content {
            text-align: center;
            animation: celebrateIn 0.5s ease;
        }

        @keyframes celebrateIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .celebration-content .emoji {
            font-size: 6rem;
            margin-bottom: 20px;
        }

        .celebration-content h2 {
            font-size: 2rem;
            color: #ffd700;
            margin-bottom: 15px;
        }

        .celebration-content p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .close-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #00b894, #55efc4);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            transform: scale(1.05);
        }

        .daily-challenge {
            background: linear-gradient(135deg, #ffd700, #f39c12);
            color: #1a1a2e;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .daily-challenge h3 {
            margin-bottom: 10px;
        }

        .daily-challenge .emoji {
            font-size: 3rem;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .day-badge {
                width: 35px;
                height: 35px;
                font-size: 0.8rem;
            }

            .mission-card .emoji {
                font-size: 3rem;
            }

            .mission-item {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Missões <span>Semanais</span></h1>
            <p>Complete desafios e ganhe recompensas!</p>
        </div>

        <div class="stats-bar">
            <div class="stat">
                <div class="stat-value" id="score">0</div>
                <div class="stat-label">Pontos</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="missions">0</div>
                <div class="stat-label">Missões</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="streak">0</div>
                <div class="stat-label">Dias Seguidos</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="level">1</div>
                <div class="stat-label">Nível</div>
            </div>
        </div>

        <div class="week-progress" id="weekProgress">
            <div class="day-badge">D</div>
            <div class="day-badge">S</div>
            <div class="day-badge">T</div>
            <div class="day-badge">Q</div>
            <div class="day-badge">Q</div>
            <div class="day-badge">S</div>
            <div class="day-badge">S</div>
        </div>

        <div class="medals">
            <span class="medal" id="medal1" title="Primeiro Dia">🥉</span>
            <span class="medal" id="medal2" title="Uma Semana">🥈</span>
            <span class="medal" id="medal3" title="Duas Semanas">🥇</span>
            <span class="medal" id="medal4" title="Um Mês">🏆</span>
            <span class="medal" id="medal5" title="Superstar">👑</span>
        </div>

        <div class="game-area">
            <div class="daily-challenge" id="dailyChallenge">
                <span class="emoji">⭐</span>
                <h3>Desafio do Dia</h3>
                <p id="dailyChallengeText">Carregando...</p>
            </div>

            <div id="streakBonus" class="streak-bonus" style="display: none;">
                <h3>🔥 Bônus de Sequência!</h3>
                <p>Você está jogando há <span id="streakDays">0</span> dias seguidos! +50 pontos extras!</p>
            </div>

            <div class="category-tabs">
                <button class="category-tab active" onclick="filterMissions('all')">Todas</button>
                <button class="category-tab" onclick="filterMissions('study')">📚 Estudo</button>
                <button class="category-tab" onclick="filterMissions('health')">💪 Saúde</button>
                <button class="category-tab" onclick="filterMissions('social')">👥 Social</button>
                <button class="category-tab" onclick="filterMissions('creative')">🎨 Criativo</button>
            </div>

            <div class="missions-list" id="missionsList"></div>
        </div>

        <div class="celebration" id="celebration">
            <div class="celebration-content">
                <div class="emoji" id="celebrationEmoji">🎉</div>
                <h2 id="celebrationTitle">Missêo Completa!</h2>
                <p id="celebrationText">Você ganhou pontos!</p>
                <button class="close-btn" onclick="closeCelebration()">Continuar</button>
            </div>
        </div>
    </div>

    <script>
        // Missões disponíveis
        const allMissions = [
            // Estudo
            { id: 1, emoji: '📖', title: 'Ler por 15 minutos', desc: 'Leia um livro ou história por 15 minutos', points: 20, category: 'study' },
            { id: 2, emoji: '✏️', title: 'Praticar escrita', desc: 'Escreva 5 frases sobre seu dia', points: 15, category: 'study' },
            { id: 3, emoji: '🔢', title: 'Matemática divertida', desc: 'Resolva 10 contas de matemática', points: 20, category: 'study' },
            { id: 4, emoji: '🎮', title: 'Jogar um jogo educativo', desc: 'Jogue um dos jogos da plataforma EAI', points: 25, category: 'study' },
            { id: 5, emoji: '🗣️', title: 'Aprender 3 palavras novas', desc: 'Descubra o significado de 3 palavras novas', points: 15, category: 'study' },

            // Saúde
            { id: 6, emoji: '🏃', title: 'Brincar ao ar livre', desc: 'Passe 30 minutos brincando fora de casa', points: 25, category: 'health' },
            { id: 7, emoji: '💧', title: 'Beber água', desc: 'Beba pelo menos 6 copos de água hoje', points: 10, category: 'health' },
            { id: 8, emoji: '🍎', title: 'Comer frutas', desc: 'Coma pelo menos 2 frutas diferentes', points: 15, category: 'health' },
            { id: 9, emoji: '😴', title: 'Dormir cedo', desc: 'Vá dormir no horário certo', points: 20, category: 'health' },
            { id: 10, emoji: '🧘', title: 'Alongamento', desc: 'Faça 5 minutos de alongamento', points: 10, category: 'health' },

            // Social
            { id: 11, emoji: '👋', title: 'Cumprimentar pessoas', desc: 'Diga "bom dia" para 5 pessoas', points: 10, category: 'social' },
            { id: 12, emoji: '🤝', title: 'Ajudar alguém', desc: 'Ajude um colega ou familiar com algo', points: 25, category: 'social' },
            { id: 13, emoji: '💬', title: 'Conversar com a família', desc: 'Converse sobre seu dia com sua família', points: 15, category: 'social' },
            { id: 14, emoji: '🎁', title: 'Fazer um elogio', desc: 'Faça um elogio sincero a alguém', points: 15, category: 'social' },
            { id: 15, emoji: '📞', title: 'Falar com um amigo', desc: 'Converse com um amigo pessoalmente ou por telefone', points: 15, category: 'social' },

            // Criativo
            { id: 16, emoji: '🎨', title: 'Fazer um desenho', desc: 'Desenhe algo que você gosta', points: 20, category: 'creative' },
            { id: 17, emoji: '🎵', title: 'Cantar uma música', desc: 'Cante sua música favorita', points: 10, category: 'creative' },
            { id: 18, emoji: '🏗️', title: 'Construir algo', desc: 'Monte algo com blocos, lego ou papel', points: 20, category: 'creative' },
            { id: 19, emoji: '📝', title: 'Escrever uma história', desc: 'Crie uma história curta', points: 25, category: 'creative' },
            { id: 20, emoji: '🎭', title: 'Fazer uma encenaçêo', desc: 'Invente uma peça de teatro ou mímica', points: 20, category: 'creative' }
        ];

        // Desafios diários
        const dailyChallenges = [
            { emoji: '🌟', text: 'Complete 3 missões de categorias diferentes!' },
            { emoji: '📚', text: 'Foque nos estudos: complete 2 missões de estudo!' },
            { emoji: '💪', text: 'Dia saudável: complete 3 missões de saúde!' },
            { emoji: '🤗', text: 'Seja social: complete 2 missões sociais!' },
            { emoji: '🎨', text: 'Seja criativo: complete 2 missões criativas!' },
            { emoji: '⚡', text: 'Super dia: complete 5 missões!' },
            { emoji: '🎯', text: 'Complete todas as missões do dia!' }
        ];

        // Estado do jogo
        let gameState = {
            score: 0,
            level: 1,
            streak: 0,
            missionsCompleted: [],
            todayMissions: [],
            lastPlayDate: null,
            totalMissionsCompleted: 0
        };

        let currentFilter = 'all';

        // Funções de áudio
        function playSound(type) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            switch(type) {
                case 'complete':
                    oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime);
                    oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.1);
                    oscillator.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.2);
                    gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.4);
                    break;
                case 'levelup':
                    const freqs = [523.25, 659.25, 783.99, 1046.50];
                    freqs.forEach((freq, i) => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.frequency.setValueAtTime(freq, audioContext.currentTime + i * 0.1);
                        gain.gain.setValueAtTime(0.1, audioContext.currentTime + i * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + i * 0.1 + 0.2);
                        osc.start(audioContext.currentTime + i * 0.1);
                        osc.stop(audioContext.currentTime + i * 0.1 + 0.2);
                    });
                    break;
            }
        }

        // Carregar progresso
        function loadProgress() {
            const saved = localStorage.getItem('missoesSemanaisProgress');
            if (saved) {
                const data = JSON.parse(saved);
                gameState = { ...gameState, ...data };
            }

            checkNewDay();
            updateDisplay();
            updateMedals();
            updateWeekProgress();
            renderMissions();
            renderDailyChallenge();
        }

        // Verificar novo dia
        function checkNewDay() {
            const today = new Date().toDateString();

            if (gameState.lastPlayDate !== today) {
                // Verificar streak
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);

                if (gameState.lastPlayDate === yesterday.toDateString()) {
                    gameState.streak++;
                } else if (gameState.lastPlayDate !== null) {
                    gameState.streak = 1;
                } else {
                    gameState.streak = 1;
                }

                gameState.lastPlayDate = today;
                gameState.todayMissions = [];

                // Selecionar missões do dia (8 aleatórias)
                const shuffled = [...allMissions].sort(() => Math.random() - 0.5);
                gameState.todayMissions = shuffled.slice(0, 8).map(m => m.id);

                saveProgress();
            }

            // Mostrar bônus de streak
            if (gameState.streak >= 3) {
                document.getElementById('streakBonus').style.display = 'block';
                document.getElementById('streakDays').textContent = gameState.streak;
            }
        }

        // Salvar progresso
        function saveProgress() {
            localStorage.setItem('missoesSemanaisProgress', JSON.stringify(gameState));
        }

        // Atualizar display
        function updateDisplay() {
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('level').textContent = gameState.level;
            document.getElementById('streak').textContent = gameState.streak;
            document.getElementById('missions').textContent = gameState.totalMissionsCompleted;
        }

        // Atualizar medalhas
        function updateMedals() {
            const medals = [
                { id: 'medal1', threshold: 1 },
                { id: 'medal2', threshold: 7 },
                { id: 'medal3', threshold: 14 },
                { id: 'medal4', threshold: 30 },
                { id: 'medal5', threshold: 100 }
            ];

            medals.forEach(medal => {
                const el = document.getElementById(medal.id);
                if (gameState.streak >= medal.threshold || gameState.totalMissionsCompleted >= medal.threshold * 3) {
                    el.classList.add('earned');
                }
            });
        }

        // Atualizar progresso da semana
        function updateWeekProgress() {
            const days = document.querySelectorAll('.day-badge');
            const today = new Date().getDay();

            days.forEach((day, index) => {
                day.classList.remove('completed', 'current');

                if (index < today || (index === 0 && today === 0)) {
                    if (gameState.streak >= (today - index) || today === 0) {
                        day.classList.add('completed');
                    }
                }

                if (index === today) {
                    day.classList.add('current');
                }
            });
        }

        // Renderizar desafio diário
        function renderDailyChallenge() {
            const dayIndex = new Date().getDay();
            const challenge = dailyChallenges[dayIndex];
            document.getElementById('dailyChallengeText').textContent = challenge.text;
            document.querySelector('.daily-challenge .emoji').textContent = challenge.emoji;
        }

        // Filtrar missões
        function filterMissions(category) {
            currentFilter = category;
            document.querySelectorAll('.category-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            renderMissions();
        }

        // Renderizar missões
        function renderMissions() {
            const container = document.getElementById('missionsList');
            container.innerHTML = '';

            let missions = allMissions.filter(m => gameState.todayMissions.includes(m.id));

            if (currentFilter !== 'all') {
                missions = missions.filter(m => m.category === currentFilter);
            }

            missions.forEach(mission => {
                const isCompleted = gameState.missionsCompleted.includes(mission.id);

                const item = document.createElement('div');
                item.className = `mission-item ${isCompleted ? 'completed' : ''}`;
                item.innerHTML = `
                    <div class="mission-checkbox ${isCompleted ? 'checked' : ''}"></div>
                    <div class="mission-content">
                        <div class="mission-title">${mission.emoji} ${mission.title}</div>
                        <div class="mission-desc">${mission.desc}</div>
                    </div>
                    <div class="mission-points">+${mission.points}</div>
                `;

                if (!isCompleted) {
                    item.onclick = () => completeMission(mission);
                }

                container.appendChild(item);
            });
        }

        // Completar missêo
        function completeMission(mission) {
            if (gameState.missionsCompleted.includes(mission.id)) return;

            playSound('complete');

            gameState.missionsCompleted.push(mission.id);
            gameState.score += mission.points;
            gameState.totalMissionsCompleted++;

            // Bônus de streak
            if (gameState.streak >= 3) {
                gameState.score += 10;
            }

            // Level up
            const newLevel = Math.floor(gameState.score / 200) + 1;
            if (newLevel > gameState.level) {
                gameState.level = newLevel;
                playSound('levelup');
            }

            updateDisplay();
            updateMedals();
            saveProgress();
            renderMissions();

            // Mostrar celebraçêo
            showCelebration(mission);
        }

        // Mostrar celebraçêo
        function showCelebration(mission) {
            document.getElementById('celebrationEmoji').textContent = mission.emoji;
            document.getElementById('celebrationTitle').textContent = 'Missêo Completa!';
            document.getElementById('celebrationText').textContent = `Você completou "${mission.title}" e ganhou ${mission.points} pontos!`;
            document.getElementById('celebration').classList.add('show');
        }

        // Fechar celebraçêo
        function closeCelebration() {
            document.getElementById('celebration').classList.remove('show');
        }

        // Inicializar
        loadProgress();
    </script>
</body>
</html>
